<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #d97706 0%, #ea580c 50%, #f97316 100%);
      min-height: 100vh;
    }
    
    .btn-custom {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #8e3be7;
      color: #ffffff;
      border-color: #8e3be7;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="card bg-white text-dark border-0 shadow-lg p-3 p-md-4 rounded-4">
          <div class="card-body">
            
            <h2 class="text-center fw-bold mb-4" style="color: #ea580c;">Accedi</h2>
            
            <form id="accessForm">
              <div class="mb-3 text-start">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" class="form-control form-control-lg fs-6" id="email" required placeholder="nome@esempio.com">
              </div>

              <div class="mb-4 text-start">
                <label for="psw" class="form-label fw-bold">Password</label>
                <input type="password" class="form-control form-control-lg fs-6" id="psw" required placeholder="••••••••">
              </div>
              
              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-custom btn-lg fw-bold rounded-3 fs-6">
                  Accedi
                </button>
              </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="small text-muted mb-0">
                Non hai un account? <a href="registrazione.html" class="fw-bold text-decoration-none" style="color: #ea580c;">Registrati qui</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('accessForm').addEventListener('submit', async function(e) {
      e.preventDefault(); 

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('psw').value;

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST', 
          headers: {
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({ email, password })
        });

        const contentType = response.headers.get("content-type");
        let result = {};

        if (contentType && contentType.includes("application/json")) {
          result = await response.json();
        } else {
          throw new Error("Il server non ha risposto con JSON valido.");
        }

        if (response.ok && result.success) {
          localStorage.setItem("userEmail", result.email);
          
          if (result.role === 'ristoratore') {
            window.location.href = '/piatti.html';
          } else if (result.role === 'cliente') {
            window.location.href = '/cliente.html';
          } else {
            alert("Ruolo utente non riconosciuto.");
          }
        } else {
          alert(result.message || 'Credenziali non valide.');
        }
      } catch (error) {
        console.error("Errore di login:", error);
        alert("Errore nella richiesta: " + error.message);
      }
    });
  </script>
</body>
</html>
