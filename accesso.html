<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>

<body>
  <h2>Accedi</h2>
  <form id="accessForm">
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" required placeholder="nome@esempio.com">
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="psw" required>
    </div>
    
    <button type="submit">Accedi</button>
  </form>

  <script>
    document.getElementById('accessForm').addEventListener('submit', async function(e) {
      e.preventDefault(); 

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('psw').value;

      try {
        const response = await fetch('http://localhost:3000/api/login', {
          method: 'POST', 
          headers: {
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({ email, password })
        });

        const contentType = response.headers.get("content-type");
        let result = {};

        if (contentType && contentType.includes("application/json")) {
          result = await response.json();
        } else {
          throw new Error("Il server non ha risposto con JSON valido.");
        }

        if (response.ok && result.success) {
          // SALVATAGGIO FONDAMENTALE PER PIATTI.HTML
          localStorage.setItem("userEmail", result.email);
          
          if (result.role === 'ristoratore') {
            window.location.href = '/piatti.html';
          } else if (result.role === 'cliente') {
            window.location.href = '/cliente.html';
          } else {
            alert("Ruolo utente non riconosciuto.");
          }
        } else {
          alert(result.message || 'Credenziali non valide.');
        }
      } catch (error) {
        console.error("Errore di login:", error);
        alert("Errore nella richiesta: " + error.message);
      }
    });
  </script>
</body>
</html>
