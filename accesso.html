<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>accesso</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    /* Stile personalizzato per le due variabili/opzioni */
    .role-options {
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }
    .role-card {
      flex: 1;
      border: 2px solid #ccc;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .role-card:hover {
      border-color: #28a745;
    }
    .role-card input[type="radio"] {
      margin-right: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #218838;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      word-break: break-word;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>

<body>
    <form id="accessForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="nome@esempio.com">
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="psw">
        </div>
        
        <button type="submit">accedi</button>
    </form>
    <script>
        document.getElementById('accessForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        var email = document.getElementById('email').value;
        var password = document.getElementById('psw').value;

        var datiUtente = {
            email: email,
            password: password
        };

        fetch('http://localhost:3000/api/login', {
            method: 'POST', 
            headers: {
                'Content-Type': 'application/json;charset=utf-8' 
            },
            body: JSON.stringify(datiUtente)
        })
        .then(function(response) {
            if (response.ok) { 
                return response.json(); 
            } else {
                throw new Error('HTTP-Error: ' + response.status);
            }
        })
        .then(function(result) {
            // Gestione del risultato e reindirizzamento in base al ruolo
            if (result.success) {
                if (result.role === 'ristoratore') {
                    window.location.href = '/ristoratore.html';
                } else if (result.role === 'cliente') {
                    window.location.href = '/cliente.html';
                } 
            } else {
                alert(result.message);
            }
        })
        .catch(function(error) {
            alert("Errore nella richiesta: " + error.message);
        });
    });

    
    </script>
</body>

</html>
