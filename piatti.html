<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piatti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #ea580c;
    }
    .card-img-top {
      height: 180px;
      object-fit: cover;
    }
    .badge-tipologia {
      background-color: #8e3be7;
    }
    .btn-outline-orange {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
    }
    .btn-outline-orange:hover {
      background-color: #8e3be7;
      color: #ffffff;
    }
  </style>
</head>

<body class="py-5">
  <div class="container">
    <div class="row mb-3">
      <div class="col d-flex justify-content-end">
        <a href="areaPersonale.html" class="btn btn-outline-light">Profilo utente</a>
      </div>
    </div>

    <div class="row mb-5">
      <div class="col text-center">
        <h1 class="fw-bold display-5 text-warning">Crea il tuo menu</h1>
        <p class="text-white">Basta schiacciare su aggiungi per inserire il piatto selezionato nel tuo menu!</p>
      </div>
    </div>

    <div class="row g-4" id="piattiContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // CARICA PIATTI 
    async function caricaPiatti() {
      try {
        const response = await fetch("http://localhost:3000/api/meals");
        if (!response.ok) {
          throw new Error("Errore nel recupero dei piatti dal server.");
        }
        const piattiArray = await response.json();
        mostraPiatti(piattiArray);

      } catch (error) {
        console.error("Errore durante il caricamento:", error);
        alert("Errore durante il caricamento dei piatti.");
      }
    }

    // MOSTRA PIATTI
    function mostraPiatti(lista) {
      const container = document.getElementById("piattiContainer");
      container.innerHTML = ""; // Pulizia container

      lista.forEach(piatto => {
        const titolo = piatto.strMeal || "Piatto senza nome";
        const categoria = piatto.strCategory || "Generico";
        const immagine = piatto.strMealThumb || "https://via.placeholder.com/400x200?text=No+Image";
        const prezzo = "Prezzo da inserire";
        let ingredientiTesto = "";
        
        if (Array.isArray(piatto.ingredients) && piatto.ingredients.length > 0) { 
          ingredientiTesto = piatto.ingredients.join(", ");
        } else {
          ingredientiTesto = "Ingredienti non specificati.";
        }
        
        const idPiatto = piatto._id;
        const cardHTML = `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
              <img src="${immagine}" class="card-img-top" alt="${titolo}">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title fw-bold m-0">${titolo}</h5>
                  <span class="badge badge-tipologia text-white px-2 py-1 rounded-2">${categoria}</span>
                </div>
                <p class="card-text text-muted small flex-grow-1">
                  <strong>Ingredienti:</strong> ${ingredientiTesto}
                </p>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                  <span class="fw-bold text-dark fs-5">${prezzo}</span>
                  <button class="btn btn-outline-orange btn-sm rounded-3 fw-semibold px-3" onclick="aggiungiAzione('${idPiatto}')">Aggiungi</button>
                </div>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // AGGIUNGI PIATTO AL MENU
    async function aggiungiAzione(idPiatto) {
      const email = localStorage.getItem("userEmail");

      if (!email) {
        alert("Nessun utente autenticato trovata in sessione. Effettua prima il login.");
        window.location.href = "/accesso.html";
        return;
      }

      if (!idPiatto) {
        alert("Errore: ID del piatto non valido.");
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/api/menu/aggiungi", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            idPiatto: idPiatto
          })
        });

        const contentType = response.headers.get("content-type");
        let data = {};

        if (contentType && contentType.includes("application/json")) {
          data = await response.json();
        } else {
          const rawText = await response.text();
          throw new Error(`Risposta server non valida (${response.status}): ${rawText.substring(0, 80)}`);
        }

        if (!response.ok) {
          throw new Error(data.message || "Errore durante l'aggiunta del piatto.");
        }

        alert(data.message || "Piatto aggiunto con successo al tuo menù!");
      } catch (error) {
        console.error("Errore durante l'aggiunta:", error);
        alert("Impossibile aggiungere il piatto: " + error.message);
      }
    }

    document.addEventListener("DOMContentLoaded", caricaPiatti);
  </script>
</body>
</html>
