<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Menù - Piatti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #ea580c;
    }
    .card-img-top {
      height: 180px;
      object-fit: cover;
    }
    .badge-tipologia {
      background-color: #8e3be7;
    }
    .btn-outline-orange {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
    }
    .btn-outline-orange:hover {
      background-color: #8e3be7;
      color: #ffffff;
    }
    
  </style>
</head>

<body class="py-5">
  <div class="container">
    <div class="row mb-3 align-items-center">
      <div class="col-6 d-flex align-items-center">
        <button class="btn btn-outline-light fw-bold shadow-sm me-2" data-bs-toggle="modal" data-bs-target="#modalNuovoPiatto">
          + Crea Nuovo Piatto Personalizzato
        </button>
        <a href="menu.html" class="btn btn-outline-light fw-bold shadow-sm">
          Vai al tuo menù
        </a>
      </div>

      <div class="col-6 d-flex justify-content-end">
        <a href="areaPersonale.html" class="btn btn-outline-light fw-bold shadow-sm">Profilo utente</a>
      </div>

    <div class="row mb-5">
      <div class="col text-center">
        <h1 class="fw-bold display-5 text-warning">Crea il tuo menu</h1>
        <p class="text-white">Seleziona i piatti dal catalogo comune oppure creane uno tuo personalizzato!</p>
      </div>
    </div>

    <div class="row g-4" id="piattiContainer"></div>
  </div>

  <div class="modal fade" id="modalNuovoPiatto" tabindex="-1" aria-labelledby="modalNuovoPiattoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title fw-bold text-dark" id="modalNuovoPiattoLabel">Aggiungi un Nuovo Piatto al Catalogo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formNuovoPiatto">
            <div class="mb-3">
              <label for="nomePiatto" class="form-label fw-semibold">Nome del Piatto *</label>
              <input type="text" class="form-control" id="nomePiatto" placeholder="Es. Cheeseburger Speciale" required>
            </div>

            <div class="mb-3">
              <label for="categoriaPiatto" class="form-label fw-semibold">Tipologia / Categoria *</label>
              <input type="text" class="form-control" id="categoriaPiatto" placeholder="Es. Burger, Pizza, Dessert..." required>
            </div>

            <div class="mb-3">
              <label for="prezzoPiatto" class="form-label fw-semibold">Prezzo (€) *</label>
              <input type="number" step="0.01" min="0" class="form-control" id="prezzoPiatto" placeholder="Es. 8.50" required>
            </div>

            <div class="mb-3">
              <label for="immaginePiatto" class="form-label fw-semibold">URL Foto Illustrativa</label>
              <input type="url" class="form-control" id="immaginePiatto" placeholder="https://esempio.com/immagine.jpg">
              <div class="form-text">Lascia vuoto se vuoi usare l'immagine predefinita.</div>
            </div>

            <div class="mb-3">
              <label for="ingredientiPiatto" class="form-label fw-semibold">Ingredienti (separati da virgola) *</label>
              <textarea class="form-control" id="ingredientiPiatto" rows="3" placeholder="Es. Carne di manzo, Formaggio Cheddar, Insalata, Pomodoro" required></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-2">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
              <button type="submit" class="btn btn-outline-orange">Salva e Aggiungi al Menù</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // funzione che carica i dati dei piatti nella pagina
    async function caricaPiatti() {
      try {
        const response = await fetch("http://localhost:3000/api/meals");
        if (!response.ok) {
          throw new Error("Errore nel recupero dei piatti dal server.");
        }
        //converte i dati da json a oggetto javascript
        const piattiArray = await response.json();
        mostraPiatti(piattiArray);

      } catch (error) {
        console.error("Errore durante il caricamento:", error);
        alert("Errore durante il caricamento dei piatti.");
      }
    }

    // gestisce i dati presi da db e li mette in formato di card, con tasto di aggiunta al proprio menù
    function mostraPiatti(lista) {
      const container = document.getElementById("piattiContainer");
      
      //scorre tutti gli oggetti piatto presenti nel array di piatti presi con la funzione caricaPiatti
      lista.forEach(piatto => {
        const titolo = piatto.strMeal || "Piatto senza nome";
        const categoria = piatto.strCategory || "Generico";
        const immagine = piatto.strMealThumb || "https://via.placeholder.com/400x200?text=No+Image";
        const prezzo = "Prezzo da inserire";
        let ingredientiTesto = "";
        
        if (piatto.ingredients.length > 0) {
          //prende l' array di ingredienti piatto e li unisce in un'unica stringa di testo separati da una virgola e uno spazio 
          ingredientiTesto = piatto.ingredients.join(", ");
        } else {
          ingredientiTesto = "Ingredienti non specificati.";
        }
        
        //costruzione della card che presenta il piatto
        const idPiatto = piatto._id;
        const cardHTML = `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
              <img src="${immagine}" class="card-img-top" alt="${titolo}">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title fw-bold m-0">${titolo}</h5>
                  <span class="badge badge-tipologia text-white px-2 py-1 rounded-2">${categoria}</span>
                </div>
                <p class="card-text text-muted small flex-grow-1">
                  <strong>Ingredienti:</strong> ${ingredientiTesto}
                </p>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                  <span class="fw-bold text-dark fs-5">${prezzo}</span>
                  <button class="btn btn-outline-orange btn-sm rounded-3 fw-semibold px-3" onclick="aggiungiPiatto('${idPiatto}')">Aggiungi</button>
                </div>
              </div>
            </div>
          </div>
        `;
        //aggiunta alla pagina
        container.innerHTML += cardHTML;
      });
    }

    //funzione che aggiunge un piatto esistente al menu del ristoratore
    // Funzione che aggiunge un piatto esistente dal catalogo al menu del ristoratore
async function aggiungiPiatto(idPiatto) {
  // 1. Recupera l'email dal LocalStorage
  const userEmail = localStorage.getItem("userEmail");

  // 2. Verifica che l'email sia presente
  if (!userEmail) {
    alert("Utente non autenticato. Effettua nuovamente il login.");
    return;
  }

  try {
    const response = await fetch("http://localhost:3000/api/menu/aggiungi", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // 3. Invia l'email corretta al backend
      body: JSON.stringify({ email: userEmail, idPiatto: idPiatto })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.message || "Errore durante l'aggiunta.");

    alert("Piatto aggiunto con successo al tuo menù!");
  } catch (error) {
    console.error("Errore aggiunta:", error);
    alert("Impossibile aggiungere il piatto: " + error.message);
  }
}
    //gestione aggiunta di un nuovo piatto nel form
    document.getElementById("formNuovoPiatto").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = localStorage.getItem("userEmail");
      
      //trim serve per rimuovere spazi bianchi
      const strMeal = document.getElementById("nomePiatto").value.trim();
      const strCategory = document.getElementById("categoriaPiatto").value.trim();
      const price = parseFloat(document.getElementById("prezzoPiatto").value);
      const strMealThumb = document.getElementById("immaginePiatto").value.trim() || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c";
      
      //i dati inizialmente vengono presi nel suo complesso
      const ingredientiRaw = document.getElementById("ingredientiPiatto").value;
      //divide la strina in un elemento dell'array ogni volta che incontra una virgola nella lettura
      const ingredientiSeparati = ingredientiRaw.split(",");
      const ingredients = [];

      for (let i = 0; i < ingredientiSeparati.length; i++) {
        const ingredientePulito = ingredientiSeparati[i].trim();
        //controllo se effettivamente la stringa esiste
        if (ingredientePulito.length > 0) {
          ingredients.push(ingredientePulito);
        }
      }

      //creazione dell'oggetto
      const nuovoPiatto = {
        email: email,
        strMeal: strMeal,
        strCategory: strCategory,
        price: price,
        strMealThumb: strMealThumb,
        ingredients: ingredients
      };

      try {
        const response = await fetch("http://localhost:3000/api/meals/crea", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nuovoPiatto)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Errore nella creazione del piatto.");

        alert("Piatto creato e inserito nel tuo menù con successo!");

        caricaPiatti();

      } catch (error) {
        console.error("Errore creazione piatto:", error);
        alert("Errore: " + error.message);
      }
    });

    //mostra i piatti al ristoratore appena viene caricata la pagina
    
    document.addEventListener("DOMContentLoaded", caricaPiatti);
  </script>
</body>
</html>
