<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu FastFood</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ea580c;
    }
    .card-img-top {
      height: 180px;
      object-fit: cover;
    }
    .badge-tipologia {
      background-color: #8e3be7;
    }
    .btn-outline-orange {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
    }
    .btn-outline-orange:hover {
      background-color: #8e3be7;
      color: #ffffff;
    }
  </style>
</head>
<body class="py-5">

  <div class="container">

    <div class="row mb-3">
      <div class="col d-flex justify-content-end">
        <a href="areaPersonale.html" class="btn btn-outline-light">profilo utente</a>
      </div>
    </div>
    
    <!-- Titolo della Pagina -->
    <div class="row mb-5">
      <div class="col text-center">
        <h1 class="fw-bold display-5 text-warning">Crea il tuo menu</h1>
        <p class="text-white">Basta schiacciare su aggiungi per inserire il piatto selezionato nel tuo menu!</p>
      </div>
    </div>

    <!-- Contenitore delle card -->
    <div class="row g-4" id="piattiContainer"></div>

  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Richiede i piatti al server Express
    async function caricaPiatti() {
      try {
        const response = await fetch('http://localhost:3000/api/meals');
        
        if (!response.ok) {
          throw new Error('Errore nel recupero dei piatti');
        }

        const piattiArray = await response.json();
        mostraPiatti(piattiArray);

      } catch (error) {
        console.error('Errore durante il caricamento:', error);
        document.getElementById('piattiContainer').innerHTML = `
          <div class="col-12 text-center text-white py-5">
            <h3>Impossibile caricare i piatti. Verifica che il server Node.js sia avviato su http://localhost:3000.</h3>
          </div>
        `;
      }
    }

    // carica i piatti sulla pagina 
    function mostraPiatti(lista) {
      const container = document.getElementById('piattiContainer');
      

      lista.forEach(piatto => {
        const titolo = piatto.strMeal || 'Piatto senza nome';
        const categoria = piatto.strCategory || 'Generico';
        const immagine = piatto.strMealThumb || 'https://via.placeholder.com/400x200?text=No+Image';
        const prezzo = piatto.price ? `${parseFloat(piatto.price).toFixed(2)} €` : 'Prezzo da inserire';

        // Estrazione dinamica degli ingredienti in base alla struttura dati presente in MongoDB
        let ingredientiTesto = '';
        if (Array.isArray(piatto.ingredients) && piatto.ingredients.length > 0) {
          ingredientiTesto = piatto.ingredients.join(', ');
        } else if (typeof piatto.ingredients === 'string') {
          ingredientiTesto = piatto.ingredients;
        } else if (piatto.strInstructions) {
          ingredientiTesto = piatto.strInstructions;
        } else {
          ingredientiTesto = 'Ingredienti non specificati.';
        }

        const cardHTML = `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
              <img src="${immagine}" class="card-img-top" alt="${titolo}">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title fw-bold m-0">${titolo}</h5>
                  <span class="badge badge-tipologia text-white px-2 py-1 rounded-2">${categoria}</span>
                </div>
                <p class="card-text text-muted small flex-grow-1">
                  <strong>Ingredienti:</strong> ${ingredientiTesto}
                </p>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                  <span class="fw-bold text-dark fs-5">${prezzo}</span>
                  <button class="btn btn-outline-orange btn-sm rounded-3 fw-semibold px-3" onclick="aggiungiAzione('${piatto._id}')">
                    Aggiungi
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        container.innerHTML += cardHTML;
      });
    }

    function aggiungiAzione(idPiatto) {
      console.log("Piatto selezionato con ID:", idPiatto);
      // Qui puoi implementare la logica per salvare il piatto nel menu del ristorante corrente
      alert('Piatto aggiunto al tuo menu!');
    }

    document.addEventListener('DOMContentLoaded', caricaPiatti);
  </script>
</body>
</html>
