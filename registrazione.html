<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrazione Utente</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #d97706 0%, #ea580c 50%, #f97316 100%);
      min-height: 100vh;
    }
    
    .btn-custom {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #8e3be7;
      color: #ffffff;
      border-color: #8e3be7;
    }

    .btn-danger-custom {
      background-color: transparent;
      color: #dc3545;
      border: 2px solid #dc3545;
      transition: all 0.3s ease;
    }

    .btn-danger-custom:hover {
      background-color: #dc3545;
      color: #ffffff;
    }

    .btn-check:checked + .btn-outline-warning {
      background-color: #ea580c;
      border-color: #ea580c;
      color: #ffffff;
    }

    .btn-outline-warning {
      color: #ea580c;
      border-color: #ea580c;
    }

    .btn-outline-warning:hover {
      background-color: #f97316;
      border-color: #f97316;
      color: #ffffff;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="card bg-white text-dark border-0 shadow-lg p-3 p-md-4 rounded-4">
          <div class="card-body">
            
            <h2 class="text-center fw-bold mb-4" style="color: #ea580c;">Registrazione</h2>
            
            <form id="registerForm">
              <div class="mb-3 text-start">
                <label for="username" class="form-label fw-bold">Username</label>
                <input type="text" class="form-control form-control-lg fs-6" id="username" required placeholder="Inserisci username">
              </div>

              <div class="mb-3 text-start">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" class="form-control form-control-lg fs-6" id="email" required placeholder="nome@esempio.com">
              </div>

              <div class="mb-3 text-start">
                <label for="password" class="form-label fw-bold">Password</label>
                <input type="password" class="form-control form-control-lg fs-6" id="password" required placeholder="Almeno 6 caratteri">
              </div>

              <div class="mb-4 text-start">
                <label class="form-label fw-bold">Tipologia Utente</label>
                <div class="row g-2">
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="roleCliente" value="cliente" checked autocomplete="off">
                    <label class="btn btn-outline-warning w-100 fw-bold py-2 fs-6 rounded-3" for="roleCliente">Cliente</label>
                  </div>
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="roleRistoratore" value="ristoratore" autocomplete="off">
                    <label class="btn btn-outline-warning w-100 fw-bold py-2 fs-6 rounded-3" for="roleRistoratore">Ristoratore</label>
                  </div>
                </div>
              </div>

              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-custom btn-lg fw-bold rounded-3 fs-6">
                  Registrati
                </button>
              </div>
            </form>

            <div id="result" class="alert mt-3" style="display: none;"></div>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="small text-muted mb-0">
                Hai già un account? <a href="accesso.html" class="fw-bold text-decoration-none" style="color: #ea580c;">Accedi qui</a>
              </p>
            </div>

            <!-- Sezione Cancella Account integrata nello stile -->
            <div class="mt-4 pt-3 border-top text-start">
              <h5 class="fw-bold mb-3 text-danger">Cancella Account</h5>
              <form id="deleteForm">
                <div class="mb-3">
                  <label for="deleteEmail" class="form-label small text-muted">Email dell'account da eliminare</label>
                  <input type="email" class="form-control fs-6" id="deleteEmail" required placeholder="nome@esempio.com">
                </div>
                <button type="submit" class="btn btn-danger-custom btn-sm w-100 fw-bold rounded-3">
                  Elimina Account
                </button>
              </form>
              <div id="deleteResult" class="alert mt-3" style="display: none;"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById('registerForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;

      try {
        const response = await fetch('http://localhost:3000/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, role })
        });

        const data = await response.json();
        resultDiv.style.display = 'block';

        if (response.ok) {
          resultDiv.className = 'alert alert-success mt-3';
          resultDiv.innerHTML = `<strong>Successo:</strong> ${data.message}`;
          localStorage.setItem('userRole', role);
          localStorage.setItem('userEmail', email);

          if (role === 'ristoratore') {
            window.location.href = 'ristoratore.html';
          } else {
            form.reset();
          }
        } else {
          resultDiv.className = 'alert alert-danger mt-3';
          resultDiv.innerHTML = `<strong>Errore:</strong> ${data.message}`;
        }
      } catch (error) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'alert alert-danger mt-3';
        resultDiv.innerHTML = '<strong>Errore di connessione:</strong> Verificare che il server sia attivo su http://localhost:3000';
      }
    });

    const deleteForm = document.getElementById('deleteForm');
    const deleteResult = document.getElementById('deleteResult');

    deleteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('deleteEmail').value.trim();

      if (!confirm(`Sei sicuro di voler eliminare l'account con email: ${email}?`)) {
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/delete-account', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        deleteResult.style.display = 'block';

        if (response.ok) {
          deleteResult.className = 'alert alert-success mt-3';
          deleteResult.innerHTML = `<strong>Cancellato:</strong> ${data.message}`;
          deleteForm.reset();

          const loggedEmail = localStorage.getItem('userEmail');
          if (loggedEmail === email) {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
          }
        } else {
          deleteResult.className = 'alert alert-danger mt-3';
          deleteResult.innerHTML = `<strong>Errore:</strong> ${data.message}`;
        }
      } catch (error) {
        deleteResult.style.display = 'block';
        deleteResult.className = 'alert alert-danger mt-3';
        deleteResult.innerHTML = '<strong>Errore di connessione.</strong>';
      }
    });
  </script>
</body>
</html>
