<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Area Ristoratore</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #218838; }
    #result { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <h1>Dati del Ristorante</h1>

  <form id="ristoratoreForm">
    <div class="form-group">
      <label for="nomeRistorante">Nome Ristorante:</label>
      <input type="text" id="nomeRistorante" required placeholder="es: Pizza da Antonio">
    </div>

    <div class="form-group">
      <label for="indirizzo">Indirizzo:</label>
      <input type="text" id="indirizzo" required placeholder="es: Piazza 24 Maggio">
    </div>

    <div class="form-group">
      <label for="telefono">Telefono:</label>
      <input type="tel" id="telefono" required placeholder="es: 0212345678">
    </div>

    <div class="form-group">
      <label for="IVA">Partita IVA:</label>
      <input type="text" id="IVA" required placeholder="es: 12345678901">
    </div>

    <button type="submit">Prosegui</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('ristoratoreForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Recupera la mail dell'utente salvata al momento della registrazione
      const userEmail = localStorage.getItem('userEmail');

      if (!userEmail) {
        alert('Nessun utente trovato in sessione. Effettua prima la registrazione.');
        window.location.href = 'index.html';
        return;
      }

      // Prepara l'oggetto ristorante
      const ristoranteData = {
        nome: document.getElementById('nomeRistorante').value,
        indirizzo: document.getElementById('indirizzo').value,
        telefono: document.getElementById('telefono').value,
        partitaIva: document.getElementById('IVA').value
      };

      try {
        const response = await fetch('http://localhost:3000/api/ristorante/dettagli', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: userEmail,
            ristorante: ristoranteData
          })
        });

        const data = await response.json();
        resultDiv.style.display = 'block';

        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `<strong>Successo:</strong> ${data.message}`;

          // Vai all'area personale dopo 1 secondo
          setTimeout(() => {
            window.location.href = 'areaPersonale.html';
          }, 1000);
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = `<strong>Errore:</strong> ${data.message}`;
        }
      } catch (error) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'error';
        resultDiv.innerHTML = '<strong>Errore di connessione con il server.</strong>';
      }
    });
  </script>
</body>
</html>
