<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Area Ristoratore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #218838;
    }
    /* Stile per il blocco del messaggio */
    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      display: none; 
      word-break: break-word;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>

  <script>
    // Controllo accessi lato client
    const savedRole = localStorage.getItem('userRole');
    if (savedRole !== 'ristoratore') {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>
  <h1>Benvenuto nell'Area Ristoratore!</h1>
  <p>Qui puoi inserire i dettagli del tuo ristorante.</p>

  <form id="ristoratoreForm">
    <div class="form-group">
      <label for="nomeRistorante">Nome Ristorante:</label>
      <input type="text" id="nomeRistorante" required placeholder="es: Pizza da Antonio">
    </div>

    <div class="form-group">
      <label for="indirizzo">Indirizzo:</label>
      <input type="text" id="indirizzo" required placeholder="es: Piazza 24 Maggio 10">
    </div>

    <div class="form-group">
      <label for="telefono">Telefono:</label>
      <input type="tel" id="telefono" required placeholder="es: 0212345678">
    </div>

    <div class="form-group">
      <label for="IVA">Partita IVA:</label>
      <input type="text" id="IVA" required placeholder="es: 12345678901">
    </div>

    <button type="submit" id="prosegui">Prosegui</button>
  </form>

  <!-- DIV RISULTATO -->
  <div id="result"></div>

  <script>
    const form = document.getElementById('ristoratoreForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // Impedisce il ricaricamento della pagina

      // Rende SUBITO visibile il blocco con un testo temporaneo
      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.style.backgroundColor = '#e2e3e5';
      resultDiv.style.color = '#383d41';
      resultDiv.innerHTML = 'Invio in corso...';

      const nomeRistorante = document.getElementById('nomeRistorante').value;
      const indirizzo = document.getElementById('indirizzo').value;
      const telefono = document.getElementById('telefono').value;
      const iva = document.getElementById('IVA').value;

      const userEmail = localStorage.getItem('userEmail');//prende le informazioni dalla registraziona
      const userRole = localStorage.getItem('userRole');

      try {
        const response = await fetch('http://localhost:3000/api/ristorante/dettagli', { //questo manda le informazioni al sever
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: userEmail,
            role: userRole,
            ristorante: { nome: nomeRistorante, indirizzo, telefono, partitaIva: iva }
          })
        });

        const data = await response.json(); 

        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.style.backgroundColor = ''; // Ripristina lo stile CSS
          resultDiv.innerHTML = `<strong>Successo (${response.status}):</strong> ${data.message}`;
        } else {
          resultDiv.className = 'error';
          resultDiv.style.backgroundColor = '';
          resultDiv.innerHTML = `<strong>Errore (${response.status}):</strong> ${data.message}`;
        }
      } catch (error) {
        resultDiv.className = 'error';
        resultDiv.style.backgroundColor = '';
        resultDiv.innerHTML = '<strong>Errore di connessione:</strong> Impossibile contattare il server Express su port 3000.';
      }
    });
  </script>
</body>
</html>
