<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elenco Ristoranti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ea580c;
    }
    .badge-indirizzo {
      background-color: #8e3be7;
    }
    .btn-outline-orange {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
    }
    .btn-outline-orange:hover {
      background-color: #8e3be7;
      color: #ffffff;
    }
  </style>
</head>
<body class="py-5">

  <div class="container">
    <!-- Header con Logout -->
    <div class="row mb-3 align-items-center">
      <div class="col text-end">
        <button class="btn btn-outline-light fw-bold shadow-sm" id="logoutBtn">Logout</button>
        <button class="btn btn-warning shadow-sm" id="ordiniUtente">📦 I Miei Ordini</button>
      </div>
    </div>

    <!-- Titolo -->
    <div class="row mb-4">
      <div class="col text-center">
        <h1 class="fw-bold display-5 text-warning">Ristoranti Disponibili</h1>
        <p class="text-white">Trova il ristorante perfetto per nome, piatto, prezzo o escludendo gli allergeni!</p>
      </div>
    </div>

    <!-- Barra di Ricerca Avanzata Ristoranti -->
    <div class="row mb-5 justify-content-center">
      <div class="col-md-11">
        <div class="row g-2">
          <div class="col-md-3">
            <input type="text" id="inputCercaRistorante" class="form-control" placeholder="Ristorante o luogo...">
          </div>
          <div class="col-md-3">
            <input type="text" id="inputCercaPiattoRist" class="form-control" placeholder="Nome piatto...">
          </div>
          <div class="col-md-2">
            <input type="number" id="inputMaxPrezzo" class="form-control" placeholder="Prezzo Max (€)" step="0.50">
          </div>
          <div class="col-md-3">
            <input type="text" id="inputAllergia" class="form-control" placeholder="Escludi allergene (es. Noci)">
          </div>
          <div class="col-md-1">
            <button class="btn btn-warning fw-bold w-100" onclick="ricercaRistorante()">Cerca</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Griglia dei Ristoranti -->
    <div class="row g-4" id="listaRistoranti"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const email = localStorage.getItem('userEmail');
        if (!email) {
          window.location.href = 'iniziale.html';
          return;
        }
        caricaRistoranti();
      });

      async function caricaRistoranti() {
        try {
          const response = await fetch('http://localhost:3000/api/ristoranti');
          const ristoranti = await response.json();
          disegnaRistoranti(ristoranti);
        } catch (err) {
          console.error('Errore nel caricamento:', err);
          document.getElementById('listaRistoranti').innerHTML = 
            '<div class="col-12 text-center text-white"><p class="fs-5">Impossibile caricare i ristoranti.</p></div>';
        }
      }

      async function ricercaRistorante() {
        const q = document.getElementById("inputCercaRistorante").value.trim();
        const piatto = document.getElementById("inputCercaPiattoRist").value.trim();
        const maxPrice = document.getElementById("inputMaxPrezzo").value.trim();
        const allergy = document.getElementById("inputAllergia").value.trim();

        if (!q && !piatto && !maxPrice && !allergy) {
          caricaRistoranti();
          return;
        }

        try {
          const params = new URLSearchParams();
          if (q) params.append("q", q);
          if (piatto) params.append("piatto", piatto);
          if (maxPrice) params.append("maxPrice", maxPrice);
          if (allergy) params.append("allergy", allergy);

          const response = await fetch(`http://localhost:3000/api/ristoranti/search?${params.toString()}`);
          if (!response.ok) throw new Error("Errore durante la ricerca.");

          const ristoranti = await response.json();
          disegnaRistoranti(ristoranti);
        } catch (err) {
          console.error('Errore ricerca:', err);
          alert("Errore durante la ricerca.");
        }
      }

      function disegnaRistoranti(ristoranti) {
        const container = document.getElementById('listaRistoranti');
        container.innerHTML = '';

        if (!ristoranti || ristoranti.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center text-white">
              <p class="fs-5">Nessun ristorante trovato con i criteri inseriti.</p>
            </div>`;
          return;
        }

        ristoranti.forEach(u => {
          const r = u.ristorante || {};
          const nome = r.nome || 'Nome non disponibile';
          const indirizzo = r.indirizzo || 'Indirizzo non specificato';
          const telefono = r.telefono || '-';
          const piva = r.partitaIva || '-';

          const cardHTML = `
            <div class="col-12 col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body d-flex flex-column">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title fw-bold m-0">${nome}</h5>
                  </div>
                  <p class="card-text text-muted small mb-1">
                    <strong>Indirizzo:</strong> ${indirizzo}
                  </p>
                  <p class="card-text text-muted small mb-1">
                    <strong>Telefono:</strong> ${telefono}
                  </p>
                  <p class="card-text text-muted small mb-3 flex-grow-1">
                    <strong>P. IVA:</strong> ${piva}
                  </p>
                  <div class="pt-3 border-top text-end">
                    <a href="menuCliente.html?id=${u._id}" class="btn btn-outline-orange btn-sm rounded-3 fw-semibold px-3">Vedi Menù</a>
                  </div>
                </div>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        });
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'iniziale.html';
      });

      document.getElementById('ordiniUtente').addEventListener('click', () => {
        window.location.href = 'ordiniCliente.html';
      });
  </script>
</body>
</html>
