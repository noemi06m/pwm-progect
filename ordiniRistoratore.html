<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordini Ricevuti - Ristoratore</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #ea580c;
    }
    .badge-stato {
      background-color: #8e3be7;
    }
    .card-ordine {
      border: none;
      border-radius: 1rem;
      overflow: hidden;
    }
    .btn-outline-orange {
      background-color: transparent;
      color: #ea580c;
      border: 2px solid #ea580c;
    }
    .btn-outline-orange:hover {
      background-color: #8e3be7;
      color: #ffffff;
      border-color: #8e3be7;
    }
  </style>
</head>

<body class="py-5">
  <div class="container">
    <!-- Pulsanti di Navigazione -->
    <div class="row mb-3 align-items-center">
      <div class="col-6 d-flex align-items-center">
        <a href="piatti.html" class="btn btn-outline-light fw-bold shadow-sm me-2">
          ← Gestione Piatti
        </a>
        <a href="menu.html" class="btn btn-outline-light fw-bold shadow-sm">
          Vai al tuo menù
        </a>
      </div>

      <div class="col-6 d-flex justify-content-end gap-2">
        <a href="ordiniRistoratore.html" class="btn btn-light text-dark fw-bold shadow-sm">
          Ordini
        </a>
        <a href="areaPersonale.html" class="btn btn-outline-light fw-bold shadow-sm">Profilo utente</a>
      </div>
    </div>

    <!-- Intestazione Pagina -->
    <div class="row mb-5">
      <div class="col text-center">
        <h1 class="fw-bold display-5 text-warning">Ordini Ricevuti</h1>
        <p class="text-white" id="infoRistorante">Caricamento informazioni ristorante in corso...</p>
      </div>
    </div>

    <!-- Container Lista Ordini -->
    <div class="row justify-content-center">
      <div class="col-md-10" id="listaOrdini">
        <!-- Gli ordini verranno inseriti qui dinamicamente -->
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", caricaOrdini);

    async function caricaOrdini() {
      const userEmail = localStorage.getItem("userEmail");

      if (!userEmail) {
        alert("Utente non autenticato. Effettua il login.");
        window.location.href = "login.html";
        return;
      }

      try {
        // 1. Recupera i dettagli del ristorante associato all'utente
        const resUtente = await fetch(`http://localhost:3000/api/utente?email=${encodeURIComponent(userEmail)}`);
        if (!resUtente.ok) {
          throw new Error("Impossibile recuperare i dati dell'utente.");
        }
        
        const dataUtente = await resUtente.json();
        const ristoranteObj = dataUtente.user?.ristorante;

        if (!ristoranteObj || !ristoranteObj.nome) {
          document.getElementById("infoRistorante").innerText = "Nessun ristorante configurato per questo account.";
          return;
        }

        const nomeRistorante = ristoranteObj.nome;
        document.getElementById("infoRistorante").innerHTML = `Gestione ordini in tempo reale per <strong>${nomeRistorante}</strong>`;

        // 2. Richiede gli ordini del ristorante dal server
        const resOrdini = await fetch(`http://localhost:3000/api/ordini/ristorante?ristorante=${encodeURIComponent(nomeRistorante)}`);
        if (!resOrdini.ok) {
          throw new Error("Errore durante il recupero degli ordini.");
        }
        
        const ordini = await resOrdini.json();
        const container = document.getElementById("listaOrdini");
        container.innerHTML = "";

        if (ordini.length === 0) {
          container.innerHTML = `
            <div class="text-center text-white my-5">
              <p class="fs-4">Non hai ancora ricevuto alcun ordine.</p>
            </div>`;
          return;
        }

        // 3. Rendering degli ordini
        ordini.forEach(ordine => {
          const dataFormatted = new Date(ordine.dataOrdine).toLocaleString("it-IT");
          const statoAttuale = ordine.stato || "inviato";
          const tempoAttuale = ordine.tempoPreparazione || "";
          
          let listaPiattiHTML = "";
          if (Array.isArray(ordine.nomiPiatti) && ordine.nomiPiatti.length > 0) {
            listaPiattiHTML = ordine.nomiPiatti.map(p => `<li class="list-group-item bg-light">${p}</li>`).join("");
          } else {
            listaPiattiHTML = `<li class="list-group-item bg-light text-muted">Nessun dettaglio piatti</li>`;
          }

          const cardHTML = `
            <div class="card card-ordine shadow-sm mb-4">
              <div class="card-header bg-warning d-flex justify-content-between align-items-center py-3">
                <span class="fw-bold text-dark fs-5">Ordine #${ordine._id.slice(-6)}</span>
                <span class="badge badge-stato text-white fs-6 px-3 py-2 rounded-3">${statoAttuale}</span>
              </div>
              <div class="card-body p-4">
                <div class="row mb-3">
                  <div class="col-md-6">
                    <p class="mb-1 text-muted"><strong>Cliente:</strong> ${ordine.emailCliente}</p>
                    <p class="mb-1 text-muted"><strong>Data Ordine:</strong> ${dataFormatted}</p>
                    <p class="mb-1 text-muted"><strong>Tempo stimato attuale:</strong> ${tempoAttuale ? tempoAttuale : 'Non specificato'}</p>
                  </div>
                  <div class="col-md-6 text-md-end">
                    <p class="fs-4 fw-bold text-dark mb-0">Totale: €${Number(ordine.totale).toFixed(2)}</p>
                  </div>
                </div>
                
                <h6 class="fw-semibold text-secondary mb-2">Piatti ordinati:</h6>
                <ul class="list-group list-group-flush rounded-3 mb-4">
                  ${listaPiattiHTML}
                </ul>

                <!-- SEZIONE AGGIORNAMENTO STATO E TEMPO DI ESECUZIONE -->
                <div class="p-3 bg-light rounded-3 border">
                  <h6 class="fw-bold text-dark mb-3">Aggiorna Stato ed Esecuzione Ordine</h6>
                  <div class="row g-2 align-items-center">
                    <div class="col-md-5">
                      <label class="form-label small fw-semibold text-muted mb-1">Tempo di esecuzione/preparazione</label>
                      <input type="text" class="form-control" id="tempo-${ordine._id}" placeholder="Es. 20 minuti / 19:30" value="${tempoAttuale}">
                    </div>
                    
                    <div class="col-md-4">
                      <label class="form-label small fw-semibold text-muted mb-1">Stato Ordine</label>
                      <select class="form-select" id="stato-${ordine._id}">
                        <option value="inviato" ${statoAttuale === 'inviato' ? 'selected' : ''}>inviato</option>
                        <option value="in preparazione" ${statoAttuale === 'in preparazione' ? 'selected' : ''}>in preparazione</option>
                        <option value="pronto" ${statoAttuale === 'pronto' ? 'selected' : ''}>pronto</option>
                        <option value="in transito" ${statoAttuale === 'in transito' ? 'selected' : ''}>in transito</option>
                        <option value="consegnato" ${statoAttuale === 'consegnato' ? 'selected' : ''}>consegnato</option>
                      </select>
                    </div>

                    <div class="col-md-3 d-grid">
                      <label class="form-label small fw-semibold text-muted mb-1">&nbsp;</label>
                      <button class="btn btn-outline-orange fw-bold" onclick="aggiornaOrdine('${ordine._id}')">
                        Salva
                      </button>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          `;
          
          container.innerHTML += cardHTML;
        });

      } catch (err) {
        console.error("Errore:", err);
        document.getElementById("listaOrdini").innerHTML = `
          <div class="alert alert-danger text-center" role="alert">
            ${err.message}
          </div>`;
      }
    }

    // Funzione per salvare le modifiche dell'ordine su MongoDB
    async function aggiornaOrdine(ordineId) {
      const nuovoStato = document.getElementById(`stato-${ordineId}`).value;
      const nuovoTempo = document.getElementById(`tempo-${ordineId}`).value.trim();

      try {
        const response = await fetch("http://localhost:3000/api/ordini/aggiorna-stato", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ordineId: ordineId,
            stato: nuovoStato,
            tempoPreparazione: nuovoTempo
          })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.message || "Errore durante l'aggiornamento.");
        }

        alert("Stato dell'ordine aggiornato con successo!");
        caricaOrdini(); // Ricarica la lista per visualizzare subito i dati aggiornati
      } catch (error) {
        console.error("Errore salvataggio:", error);
        alert("Impossibile aggiornare l'ordine: " + error.message);
      }
    }
  </script>
</body>
</html>
