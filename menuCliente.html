<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menù Ristorante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #ea580c;
    }
    .card-img-top {
      height: 180px;
      object-fit: cover;
    }
    .badge-tipologia {
      background-color: #8e3be7;
    }
    .badge-prezzo {
      background-color: #28a745;
    }
    .info-header {
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      border-radius: 12px;
      padding: 20px;
      color: white;
      margin-bottom: 30px;
    }
    .btn-add-carrello {
      background-color: #ea580c;
      color: white;
      border: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn-add-carrello:hover {
      background-color: #c2410c;
      color: white;
    }
  </style>
</head>

<body class="py-5">
  <div class="container">

    <div class="row mb-3">
      <div class="col d-flex justify-content-between align-items-center">
        <a href="elenco.html" class="btn btn-outline-light">&larr; Torna ai Ristoranti</a>
        <div>
          <a href="checkout.html" class="btn btn-warning me-2 fw-semibold">🛒 Vai al Checkout</a>
          <a href="areaPersonale.html" class="btn btn-outline-light">Profilo utente</a>
        </div>
      </div>
    </div>

    <div class="info-header" id="ristoranteHeader">
      <h1 class="fw-bold display-5 text-warning mb-2" id="rNome">Caricamento...</h1>
      <p class="mb-1" id="rIndirizzo"></p>
      <p class="mb-0" id="rTelefono"></p>
    </div>

    <div class="row g-4" id="piattiContainer"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let nomeRistoranteCorrente = "";

    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Estrae l'ID del ristorante dai parametri della query string dell'URL
      const urlParams = new URLSearchParams(window.location.search);
      const ristoranteId = urlParams.get('id');

      if (!ristoranteId) {
        alert("Nessun ristorante selezionato.");
        window.location.href = "cliente.html";
        return;
      }

      // 2. Recupera le informazioni ed il menu del ristorante selezionato dal server
      try {
        const response = await fetch(`http://localhost:3000/api/ristorante/${encodeURIComponent(ristoranteId)}`);
        if (!response.ok) {
          throw new Error("Impossibile recuperare i dati del ristorante.");
        }

        const data = await response.json();

        // Salva il nome del ristorante per usarlo nel checkout
        nomeRistoranteCorrente = data.nome || "Ristorante";

        // Popola l'intestazione con i dati del ristorante
        document.getElementById("rNome").innerText = data.nome;
        document.getElementById("rIndirizzo").innerText = `Indirizzo: ${data.indirizzo}`;
        document.getElementById("rTelefono").innerText = `Telefono: ${data.telefono}`;

        // Popola l'elenco dei piatti
        mostraMenu(data.menu);

      } catch (error) {
        console.error("Errore durante il caricamento del menù:", error);
        document.getElementById("piattiContainer").innerHTML = `
          <div class="col-12 text-center text-white">
            <p class="fs-5">Errore durante il caricamento del menù. Riprova più tardi.</p>
          </div>
        `;
      }
    });

    // Funzione per generare le schede dei piatti inseriti nel menù del ristorante
    function mostraMenu(listaMenu) {
      const container = document.getElementById("piattiContainer");
      container.innerHTML = ""; // Pulizia contenitore

      if (!Array.isArray(listaMenu) || listaMenu.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center text-white">
            <p class="fs-5">Questo ristorante non ha ancora aggiunto piatti al proprio menù.</p>
          </div>
        `;
        return;
      }

      listaMenu.forEach(piatto => {
        const titolo = piatto.strMeal || "Piatto senza nome";
        const categoria = piatto.strCategory || "Generico";
        const immagine = piatto.strMealThumb || "https://via.placeholder.com/400x200?text=No+Image";
        const prezzoOriginale = piatto.price !== undefined ? piatto.price : 0;
        
        // Gestione Prezzo Visivo
        let prezzoTesto = "Prezzo non specificato";
        if (piatto.price !== undefined && piatto.price !== "") {
          prezzoTesto = typeof piatto.price === 'number' ? `${piatto.price.toFixed(2)} €` : `${piatto.price} €`;
        }

        // Gestione Ingredienti
        let ingredientiTesto = "Ingredienti non specificati.";
        if (Array.isArray(piatto.ingredients) && piatto.ingredients.length > 0) {
          ingredientiTesto = piatto.ingredients.join(", ");
        }

        // Fuga di eventuali virgolette nel titolo del piatto per evitare errori JavaScript
        const titoloPulito = titolo.replace(/'/g, "\\'");

        const cardHTML = `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
              <img src="${immagine}" class="card-img-top" alt="${titolo}">
              <div class="card-body d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title fw-bold m-0">${titolo}</h5>
                  <span class="badge badge-tipologia text-white px-2 py-1 rounded-2">${categoria}</span>
                </div>
                <p class="card-text text-muted small flex-grow-1">
                  <strong>Ingredienti:</strong> ${ingredientiTesto}
                </p>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                  <span class="badge badge-prezzo fs-6 px-3 py-2 text-white">${prezzoTesto}</span>
                  <button class="btn btn-add-carrello btn-sm px-3 py-2 rounded-3" 
                    onclick="aggiungiAlCarrello('${piatto.mealId || piatto._id}', '${prezzoOriginale}')">
                    Aggiungi +
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // Funzione per aggiungere il piatto al carrello (localStorage)
    async function aggiungiAlCarrello(idPiatto, prezzo) {
      const emailUtente = localStorage.getItem("userEmail"); // Recupera l'email dell'utente loggato

      if (!emailUtente) {
        alert("Effettua il login per aggiungere prodotti al carrello.");
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/api/carrello/aggiungi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailUtente,
            idPiatto: idPiatto,
            price: Number(prezzo)
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert("Piatto aggiunto al carrello con successo!");
        } else {
          alert(data.message || "Errore durante l'aggiunta al carrello.");
        }
      } catch (error) {
        console.error("Errore aggiunta carrello:", error);
        alert("Errore di connessione al server.");
      }
    }
  </script>
</body>
</html>
